name: validate-word-packs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generated files (no drift)
        run: python3 scripts/build_catalog.py --check

      - name: Validate release
        run: python3 scripts/validate_release.py
